# ============================================================================
# ARIS Academy — Deploy Pipeline
# Build Docker images, push to GHCR, deploy to VM-ACADEMY via SSH
# Triggers on push to main or manual dispatch
# ============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ${{ secrets.CI_REGISTRY || 'ghcr.io' }}
  IMAGE_PREFIX: ${{ secrets.CI_REGISTRY_IMAGE || format('ghcr.io/{0}/aris-academy', github.repository_owner) }}

jobs:
  # =========================================================================
  # Wait for CI to pass before deploying
  # =========================================================================
  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Wait for CI workflow
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Frontend'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success
      - name: Wait for Backend CI
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Backend'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

  # =========================================================================
  # Build & Push Docker Images
  # =========================================================================
  build-and-push:
    name: Build ${{ matrix.service }}
    needs: [ci-gate]
    if: always() && (needs.ci-gate.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: frontend
            context: ./frontend
            dockerfile: ./infra/docker/Dockerfile.frontend
          - service: academy-course
            context: ./backend
            dockerfile: ./infra/docker/Dockerfile.service
            build-args: SERVICE_NAME=academy-course
          - service: academy-learning
            context: ./backend
            dockerfile: ./infra/docker/Dockerfile.service
            build-args: SERVICE_NAME=academy-learning
          - service: academy-assessment
            context: ./backend
            dockerfile: ./infra/docker/Dockerfile.service
            build-args: SERVICE_NAME=academy-assessment
          - service: academy-live
            context: ./backend
            dockerfile: ./infra/docker/Dockerfile.service
            build-args: SERVICE_NAME=academy-live

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # Deploy to VM-ACADEMY
  # =========================================================================
  deploy:
    name: Deploy to VM
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_ACADEMY_HOST }}
          username: ${{ secrets.VM_ACADEMY_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          password: ${{ secrets.VM_ACADEMY_PASSWORD }}
          script: |
            cd /opt/aris-academy

            # Pull latest code
            git pull origin main

            # Pull latest images
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            # Rolling update
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            # Clean up old images
            docker image prune -f

            # Health check (retry up to 30s per service)
            echo "Waiting for services to be healthy..."
            sleep 10

            check_health() {
              local name=$1 url=$2
              for i in 1 2 3 4 5 6; do
                if curl -sf --max-time 5 "$url" > /dev/null 2>&1; then
                  echo "✓ $name healthy"
                  return 0
                fi
                sleep 5
              done
              echo "✗ $name FAILED at $url"
              return 1
            }

            FAILED=0
            check_health "Frontend"   "http://localhost:3000/login" || FAILED=1
            check_health "Course"     "http://localhost:4001/health" || FAILED=1
            check_health "Learning"   "http://localhost:4002/health" || FAILED=1
            check_health "Assessment" "http://localhost:4003/health" || FAILED=1
            check_health "Live"       "http://localhost:4004/health" || FAILED=1

            if [ $FAILED -ne 0 ]; then
              echo "DEPLOYMENT HEALTH CHECK FAILED — rolling back"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=50
              exit 1
            fi

            echo "Deployment successful: $(date)"
