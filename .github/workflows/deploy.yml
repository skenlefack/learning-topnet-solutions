# ============================================================================
# ARIS Academy — Deploy Pipeline
# Build Docker images, push to GHCR, deploy to VM-ACADEMY via SSH
# Triggers on push to main or manual dispatch
# ============================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ${{ secrets.CI_REGISTRY || 'ghcr.io' }}
  IMAGE_PREFIX: ${{ secrets.CI_REGISTRY_IMAGE || format('ghcr.io/{0}/aris-academy', github.repository_owner) }}

jobs:
  # =========================================================================
  # Build & Push Docker Images
  # =========================================================================
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: frontend
            context: ./frontend
            dockerfile: ./infra/docker/Dockerfile.frontend
          - service: academy-course
            context: ./backend
            dockerfile: ./infra/docker/Dockerfile.service
            build-args: SERVICE_NAME=academy-course
          - service: academy-learning
            context: ./backend
            dockerfile: ./infra/docker/Dockerfile.service
            build-args: SERVICE_NAME=academy-learning
          - service: academy-assessment
            context: ./backend
            dockerfile: ./infra/docker/Dockerfile.service
            build-args: SERVICE_NAME=academy-assessment
          - service: academy-live
            context: ./backend
            dockerfile: ./infra/docker/Dockerfile.service
            build-args: SERVICE_NAME=academy-live

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # Deploy to VM-ACADEMY
  # =========================================================================
  deploy:
    name: Deploy to VM
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_ACADEMY_HOST }}
          username: ${{ secrets.VM_ACADEMY_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          password: ${{ secrets.VM_ACADEMY_PASSWORD }}
          script: |
            cd /opt/aris-academy

            # Pull latest images
            docker compose pull

            # Rolling update
            docker compose up -d --remove-orphans

            # Clean up old images
            docker image prune -f

            # Health check
            sleep 10
            curl -sf http://localhost:3000/api/health || echo "Frontend health check failed"
            curl -sf http://localhost:4001/health || echo "Course service health check failed"
            curl -sf http://localhost:4002/health || echo "Learning service health check failed"
            curl -sf http://localhost:4003/health || echo "Assessment service health check failed"
            curl -sf http://localhost:4004/health || echo "Live service health check failed"

            echo "Deployment complete: $(date)"
