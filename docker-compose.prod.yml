###############################################################################
# ARIS Academy — Docker Compose Production Overlay
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# AU-IBAR (c) 2026
###############################################################################

name: aris-academy

services:
  # =========================================================================
  # INFRASTRUCTURE OVERRIDES
  # =========================================================================

  postgres:
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
    restart: unless-stopped
    ports: []  # No external exposure in production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - db-net
      - backend-net
    environment:
      POSTGRES_DB: academy
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=3GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "log_min_duration_statement=500"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"

  redis:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    ports: []
    command: >
      redis-server
      --appendonly yes
      --maxmemory 768mb
      --maxmemory-policy allkeys-lru
      --tcp-backlog 511
      --save 900 1
      --save 300 10
      --save 60 10000
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - db-net
      - backend-net

  kafka:
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G
    restart: unless-stopped
    ports: []
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "aris-academy-kafka-cluster-01"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - backend-net

  kafka-init:
    networks:
      - backend-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  migrate:
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/academy
    networks:
      - db-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # =========================================================================
  # BACKEND MICROSERVICES OVERRIDES
  # =========================================================================

  academy-course:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped
    ports: []
    environment:
      SERVICE_NAME: academy-course
      SERVICE_PORT: 4001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/academy
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      METRICS_ENABLED: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - backend-net
      - db-net
      - frontend-net

  academy-learning:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped
    ports: []
    environment:
      SERVICE_NAME: academy-learning
      SERVICE_PORT: 4002
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/academy
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      METRICS_ENABLED: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - backend-net
      - db-net
      - frontend-net

  academy-assessment:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped
    ports: []
    environment:
      SERVICE_NAME: academy-assessment
      SERVICE_PORT: 4003
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/academy
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      METRICS_ENABLED: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - backend-net
      - db-net
      - frontend-net

  academy-live:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped
    ports: []
    environment:
      SERVICE_NAME: academy-live
      SERVICE_PORT: 4004
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/academy
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      BBB_URL: ${BBB_URL}
      BBB_SECRET: ${BBB_SECRET}
      METRICS_ENABLED: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - backend-net
      - db-net
      - frontend-net

  # =========================================================================
  # FRONTEND OVERRIDE
  # =========================================================================

  frontend:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    ports: []
    environment:
      NEXT_PUBLIC_API_URL: https://learning.au-ibar.org/api
      NEXT_PUBLIC_BBB_URL: ${BBB_URL:-http://10.202.101.145/bigbluebutton/}
      NEXT_PUBLIC_APP_URL: https://learning.au-ibar.org
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - frontend-net

  # =========================================================================
  # REVERSE PROXY (Traefik) — PRODUCTION CONFIG
  # =========================================================================

  traefik:
    image: traefik:v3.3
    container_name: academy-traefik
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M
    command: []  # Clear base command — use static config file instead
    ports:
      - "80:80"
      - "443:443"
      # No 8080 dashboard port exposed externally in production
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/nginx/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/nginx/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
      - letsencrypt_data:/letsencrypt
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - frontend-net
      - backend-net

  # =========================================================================
  # STORAGE OVERRIDE
  # =========================================================================

  minio:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    ports: []
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - backend-net

  minio-init:
    networks:
      - backend-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # =========================================================================
  # MONITORING STACK
  # =========================================================================

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: academy-prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=10GB"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - monitoring-net
      - backend-net
    # No external ports — accessed via Grafana only

  grafana:
    image: grafana/grafana:10.4.0
    container_name: academy-grafana
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-aris-grafana-2026}
      GF_SERVER_ROOT_URL: https://learning.au-ibar.org/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - monitoring-net
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: academy-node-exporter
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - monitoring-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: academy-postgres-exporter
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/academy?sslmode=disable"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - monitoring-net
      - db-net
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: academy-redis-exporter
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    environment:
      REDIS_ADDR: redis://redis:6379
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - monitoring-net
      - db-net
    depends_on:
      redis:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: academy-alertmanager
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=https://learning.au-ibar.org/alertmanager"
    volumes:
      - ./infra/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - monitoring-net
    depends_on:
      - prometheus

# =========================================================================
# VOLUMES — extend base volumes with monitoring
# =========================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  minio_data:
    driver: local
  letsencrypt_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local

# =========================================================================
# NETWORKS — isolated tiers
# =========================================================================
networks:
  # Override the single flat network from base compose
  academy-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

  frontend-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.1.0/24

  backend-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.2.0/24

  db-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.3.0/24

  monitoring-net:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.4.0/24
