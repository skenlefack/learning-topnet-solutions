###############################################################################
# ARIS Academy — Traefik Dynamic Routing
# learning.au-ibar.org | 10.202.101.144
###############################################################################

http:
  # =========================================================================
  # Routers — HTTP (port 80) for internal access
  # =========================================================================
  routers:
    # --- Frontend (HTTP) ---------------------------------------------------
    academy-web-http:
      rule: "Host(`learning.au-ibar.org`) || Host(`10.202.101.144`)"
      entryPoints: ["web"]
      service: academy-frontend
      middlewares: ["security-headers", "compress", "rate-limit-frontend"]
      priority: 1

    # --- API: Public (HTTP, no auth) ----------------------------------------
    academy-api-public-http:
      rule: "(Host(`learning.au-ibar.org`) || Host(`10.202.101.144`)) && PathPrefix(`/api/public`)"
      entryPoints: ["web"]
      service: academy-course-svc
      middlewares: ["api-strip-courses", "cors", "rate-limit", "security-headers", "compress"]
      priority: 15

    # --- API: Course (HTTP) ------------------------------------------------
    academy-api-course-http:
      rule: "(Host(`learning.au-ibar.org`) || Host(`10.202.101.144`)) && PathPrefix(`/api/courses`)"
      entryPoints: ["web"]
      service: academy-course-svc
      middlewares: ["api-strip-courses", "cors", "rate-limit", "security-headers", "compress", "retry"]
      priority: 10

    # --- API: Learning (HTTP) ----------------------------------------------
    academy-api-learning-http:
      rule: "(Host(`learning.au-ibar.org`) || Host(`10.202.101.144`)) && PathPrefix(`/api/learning`)"
      entryPoints: ["web"]
      service: academy-learning-svc
      middlewares: ["api-strip-learning", "cors", "rate-limit", "security-headers", "compress", "retry"]
      priority: 10

    # --- API: Assessment (HTTP) --------------------------------------------
    academy-api-assessment-http:
      rule: "(Host(`learning.au-ibar.org`) || Host(`10.202.101.144`)) && PathPrefix(`/api/assessment`)"
      entryPoints: ["web"]
      service: academy-assessment-svc
      middlewares: ["api-strip-assessment", "cors", "rate-limit", "security-headers", "compress", "retry"]
      priority: 10

    # --- API: Live (HTTP) --------------------------------------------------
    academy-api-live-http:
      rule: "(Host(`learning.au-ibar.org`) || Host(`10.202.101.144`)) && PathPrefix(`/api/live`)"
      entryPoints: ["web"]
      service: academy-live-svc
      middlewares: ["api-strip-live", "cors", "rate-limit", "security-headers", "compress", "retry"]
      priority: 10

    # --- BigBlueButton reverse proxy ----------------------------------------
    bbb-proxy-http:
      rule: "(Host(`learning.au-ibar.org`) || Host(`10.202.101.144`)) && PathPrefix(`/bigbluebutton`)"
      entryPoints: ["web"]
      service: bbb-backend
      priority: 20

    # --- Traefik Dashboard (HTTP, secured) ----------------------------------
    academy-dashboard-http:
      rule: "(Host(`learning.au-ibar.org`) || Host(`10.202.101.144`)) && PathPrefix(`/traefik`)"
      entryPoints: ["web"]
      service: api@internal
      middlewares: ["dashboard-auth"]

    # =====================================================================
    # Routers — HTTPS (port 443) with TLS (domain only, no IP)
    # These activate automatically once Let's Encrypt issues the cert
    # =====================================================================
    academy-web-https:
      rule: "Host(`learning.au-ibar.org`)"
      entryPoints: ["websecure"]
      service: academy-frontend
      middlewares: ["security-headers", "compress", "rate-limit-frontend"]
      priority: 1
      tls:
        certResolver: letsencrypt

    academy-api-public-https:
      rule: "Host(`learning.au-ibar.org`) && PathPrefix(`/api/public`)"
      entryPoints: ["websecure"]
      service: academy-course-svc
      middlewares: ["api-strip-courses", "cors", "rate-limit", "security-headers", "compress"]
      priority: 15
      tls:
        certResolver: letsencrypt

    academy-api-course-https:
      rule: "Host(`learning.au-ibar.org`) && PathPrefix(`/api/courses`)"
      entryPoints: ["websecure"]
      service: academy-course-svc
      middlewares: ["api-strip-courses", "cors", "rate-limit", "security-headers", "compress", "retry"]
      priority: 10
      tls:
        certResolver: letsencrypt

    academy-api-learning-https:
      rule: "Host(`learning.au-ibar.org`) && PathPrefix(`/api/learning`)"
      entryPoints: ["websecure"]
      service: academy-learning-svc
      middlewares: ["api-strip-learning", "cors", "rate-limit", "security-headers", "compress", "retry"]
      priority: 10
      tls:
        certResolver: letsencrypt

    academy-api-assessment-https:
      rule: "Host(`learning.au-ibar.org`) && PathPrefix(`/api/assessment`)"
      entryPoints: ["websecure"]
      service: academy-assessment-svc
      middlewares: ["api-strip-assessment", "cors", "rate-limit", "security-headers", "compress", "retry"]
      priority: 10
      tls:
        certResolver: letsencrypt

    academy-api-live-https:
      rule: "Host(`learning.au-ibar.org`) && PathPrefix(`/api/live`)"
      entryPoints: ["websecure"]
      service: academy-live-svc
      middlewares: ["api-strip-live", "cors", "rate-limit", "security-headers", "compress", "retry"]
      priority: 10
      tls:
        certResolver: letsencrypt

    academy-dashboard-https:
      rule: "Host(`learning.au-ibar.org`) && PathPrefix(`/traefik`)"
      entryPoints: ["websecure"]
      service: api@internal
      middlewares: ["dashboard-auth"]
      tls:
        certResolver: letsencrypt

  # =========================================================================
  # Services (load-balanced backends)
  # =========================================================================
  services:
    academy-frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:3000"
        healthCheck:
          path: /
          interval: 30s
          timeout: 5s

    academy-course-svc:
      loadBalancer:
        servers:
          - url: "http://academy-course:4001"
        healthCheck:
          path: /health
          interval: 15s
          timeout: 5s

    academy-learning-svc:
      loadBalancer:
        servers:
          - url: "http://academy-learning:4002"
        healthCheck:
          path: /health
          interval: 15s
          timeout: 5s

    academy-assessment-svc:
      loadBalancer:
        servers:
          - url: "http://academy-assessment:4003"
        healthCheck:
          path: /health
          interval: 15s
          timeout: 5s

    academy-live-svc:
      loadBalancer:
        servers:
          - url: "http://academy-live:4004"
        healthCheck:
          path: /health
          interval: 15s
          timeout: 5s

    bbb-backend:
      loadBalancer:
        servers:
          - url: "http://10.202.101.145:80"
        passHostHeader: false

  # =========================================================================
  # Middlewares
  # =========================================================================
  middlewares:
    # --- Strip prefixes (per service) ----------------------------------------
    api-strip-courses:
      stripPrefix:
        prefixes:
          - "/api"

    api-strip-learning:
      stripPrefix:
        prefixes:
          - "/api/learning"

    api-strip-assessment:
      stripPrefix:
        prefixes:
          - "/api/assessment"

    api-strip-live:
      stripPrefix:
        prefixes:
          - "/api/live"

    # --- CORS --------------------------------------------------------------
    cors:
      headers:
        accessControlAllowOriginList:
          - "https://learning.au-ibar.org"
          - "https://au-ibar.org"
          - "http://learning.au-ibar.org"
          - "http://10.202.101.144"
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Content-Type
          - Authorization
          - X-Tenant-ID
          - X-Request-ID
          - Accept-Language
        accessControlExposeHeaders:
          - X-Request-ID
          - X-RateLimit-Limit
          - X-RateLimit-Remaining
        accessControlMaxAge: 86400
        addVaryHeader: true

    # --- Rate limiting (API) — 100 avg / 200 burst per source IP ----------
    rate-limit:
      rateLimit:
        average: 100
        burst: 200
        period: 1s
        sourceCriterion:
          requestHeaderName: X-Forwarded-For

    # --- Rate limiting (frontend) — more generous -------------------------
    rate-limit-frontend:
      rateLimit:
        average: 200
        burst: 400
        period: 1s
        sourceCriterion:
          requestHeaderName: X-Forwarded-For

    # --- Security headers --------------------------------------------------
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "camera=(), microphone=(self), geolocation=(), payment=()"
        customResponseHeaders:
          X-Content-Type-Options: "nosniff"
          X-Download-Options: "noopen"
          X-Permitted-Cross-Domain-Policies: "none"
          X-Robots-Tag: "noindex, nofollow"

    # --- Gzip compression --------------------------------------------------
    compress:
      compress:
        excludedContentTypes:
          - text/event-stream
        minResponseBodyBytes: 1024

    # --- Retry (backend services) ------------------------------------------
    retry:
      retry:
        attempts: 3
        initialInterval: 100ms

    # --- Dashboard basic auth (generate with htpasswd) ---------------------
    dashboard-auth:
      basicAuth:
        users:
          - "admin:$apr1$ARIS2026$ly1e4f69xCaUOzHH6mYFv0"
