###############################################################################
# Topnet Solutions Academy — Traefik Dynamic Routing (Let's Encrypt TLS)
# learning.topnet-solutions.com | 179.237.122.141
###############################################################################

http:
  routers:
    # --- HTTP to HTTPS redirect ---
    http-to-https:
      rule: "Host(`learning.topnet-solutions.com`)"
      entryPoints: ["web"]
      middlewares: ["redirect-https"]
      service: academy-frontend

    # --- Frontend HTTPS ---
    academy-web:
      rule: "Host(`learning.topnet-solutions.com`)"
      entryPoints: ["websecure"]
      service: academy-frontend
      middlewares: ["security-headers", "compress"]
      tls:
        certResolver: letsencrypt
      priority: 1

    # --- Frontend HTTP (IP direct) ---
    academy-web-ip:
      rule: "Host(`179.237.122.141`)"
      entryPoints: ["web"]
      service: academy-frontend
      middlewares: ["security-headers", "compress"]
      priority: 1

    # --- API: Public ---
    academy-api-public:
      rule: "Host(`learning.topnet-solutions.com`) && PathPrefix(`/api/public`)"
      entryPoints: ["websecure"]
      service: academy-course-svc
      middlewares: ["api-strip-courses", "cors", "security-headers"]
      tls:
        certResolver: letsencrypt
      priority: 15

    academy-api-public-http:
      rule: "(Host(`learning.topnet-solutions.com`) || Host(`179.237.122.141`)) && PathPrefix(`/api/public`)"
      entryPoints: ["web"]
      service: academy-course-svc
      middlewares: ["api-strip-courses", "cors", "security-headers"]
      priority: 15

    # --- API: Course ---
    academy-api-course:
      rule: "Host(`learning.topnet-solutions.com`) && PathPrefix(`/api/courses`)"
      entryPoints: ["websecure"]
      service: academy-course-svc
      middlewares: ["api-strip-courses", "cors", "security-headers"]
      tls:
        certResolver: letsencrypt
      priority: 10

    academy-api-course-http:
      rule: "(Host(`learning.topnet-solutions.com`) || Host(`179.237.122.141`)) && PathPrefix(`/api/courses`)"
      entryPoints: ["web"]
      service: academy-course-svc
      middlewares: ["api-strip-courses", "cors", "security-headers"]
      priority: 10

    # --- API: Learning ---
    academy-api-learning:
      rule: "Host(`learning.topnet-solutions.com`) && PathPrefix(`/api/learning`)"
      entryPoints: ["websecure"]
      service: academy-learning-svc
      middlewares: ["api-strip-learning", "cors", "security-headers"]
      tls:
        certResolver: letsencrypt
      priority: 10

    academy-api-learning-http:
      rule: "(Host(`learning.topnet-solutions.com`) || Host(`179.237.122.141`)) && PathPrefix(`/api/learning`)"
      entryPoints: ["web"]
      service: academy-learning-svc
      middlewares: ["api-strip-learning", "cors", "security-headers"]
      priority: 10

    # --- API: Assessment ---
    academy-api-assessment:
      rule: "Host(`learning.topnet-solutions.com`) && PathPrefix(`/api/assessment`)"
      entryPoints: ["websecure"]
      service: academy-assessment-svc
      middlewares: ["api-strip-assessment", "cors", "security-headers"]
      tls:
        certResolver: letsencrypt
      priority: 10

    academy-api-assessment-http:
      rule: "(Host(`learning.topnet-solutions.com`) || Host(`179.237.122.141`)) && PathPrefix(`/api/assessment`)"
      entryPoints: ["web"]
      service: academy-assessment-svc
      middlewares: ["api-strip-assessment", "cors", "security-headers"]
      priority: 10

    # --- API: Live ---
    academy-api-live:
      rule: "Host(`learning.topnet-solutions.com`) && PathPrefix(`/api/live`)"
      entryPoints: ["websecure"]
      service: academy-live-svc
      middlewares: ["api-strip-live", "cors", "security-headers"]
      tls:
        certResolver: letsencrypt
      priority: 10

    academy-api-live-http:
      rule: "(Host(`learning.topnet-solutions.com`) || Host(`179.237.122.141`)) && PathPrefix(`/api/live`)"
      entryPoints: ["web"]
      service: academy-live-svc
      middlewares: ["api-strip-live", "cors", "security-headers"]
      priority: 10

    # --- API: Commerce ---
    academy-api-commerce:
      rule: "Host(`learning.topnet-solutions.com`) && PathPrefix(`/api/commerce`)"
      entryPoints: ["websecure"]
      service: academy-commerce-svc
      middlewares: ["api-strip-commerce", "cors", "security-headers"]
      tls:
        certResolver: letsencrypt
      priority: 10

    academy-api-commerce-http:
      rule: "(Host(`learning.topnet-solutions.com`) || Host(`179.237.122.141`)) && PathPrefix(`/api/commerce`)"
      entryPoints: ["web"]
      service: academy-commerce-svc
      middlewares: ["api-strip-commerce", "cors", "security-headers"]
      priority: 10

  # =========================================================================
  # Services
  # =========================================================================
  services:
    academy-frontend:
      loadBalancer:
        servers:
          - url: "http://academy-frontend:3000"

    academy-course-svc:
      loadBalancer:
        servers:
          - url: "http://academy-course:4001"

    academy-learning-svc:
      loadBalancer:
        servers:
          - url: "http://academy-learning:4002"

    academy-assessment-svc:
      loadBalancer:
        servers:
          - url: "http://academy-assessment:4003"

    academy-live-svc:
      loadBalancer:
        servers:
          - url: "http://academy-live:4004"

    academy-commerce-svc:
      loadBalancer:
        servers:
          - url: "http://academy-commerce:4005"

  # =========================================================================
  # Middlewares
  # =========================================================================
  middlewares:
    redirect-https:
      redirectScheme:
        scheme: https
        permanent: true

    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          X-Powered-By: ""

    compress:
      compress: {}

    cors:
      headers:
        accessControlAllowOriginList:
          - "https://learning.topnet-solutions.com"
          - "http://learning.topnet-solutions.com"
          - "http://179.237.122.141"
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Content-Type
          - Authorization
          - X-Requested-With
          - X-Tenant-Id
        accessControlMaxAge: 86400
        addVaryHeader: true

    rate-limit:
      rateLimit:
        average: 100
        burst: 200
        period: 1m

    api-strip-courses:
      stripPrefix:
        prefixes:
          - "/api"
        forceSlash: false

    api-strip-learning:
      stripPrefix:
        prefixes:
          - "/api/learning"
        forceSlash: false

    api-strip-assessment:
      stripPrefix:
        prefixes:
          - "/api/assessment"
        forceSlash: false

    api-strip-live:
      stripPrefix:
        prefixes:
          - "/api/live"
        forceSlash: false

    api-strip-commerce:
      stripPrefix:
        prefixes:
          - "/api/commerce"
        forceSlash: false
