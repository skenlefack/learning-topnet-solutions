###############################################################################
# Topnet Solutions Academy — Grafana Dashboard Provisioning
# Auto-loads dashboards from the filesystem
###############################################################################

apiVersion: 1

providers:
  - name: "Topnet Solutions Academy"
    orgId: 1
    folder: "Topnet Solutions Academy"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
