###############################################################################
# ARIS Academy — Alertmanager Configuration
# Email notifications grouped by severity
###############################################################################

global:
  resolve_timeout: 5m
  # -------------------------------------------------------------------------
  # SMTP settings — configure via setup-vm-academy.sh or edit manually
  # -------------------------------------------------------------------------
  smtp_smarthost: "mail.au-ibar.org:587"
  smtp_from: "lms-alerts@au-ibar.org"
  smtp_auth_username: "lms-alerts@au-ibar.org"
  # Set via: export SMTP_PASSWORD=... then sed -i in setup-vm-academy.sh
  # Or configure in .env and inject via docker-compose env_file
  smtp_auth_password: "${SMTP_PASSWORD:-SMTP_PASSWORD_SET_BY_SETUP}"
  smtp_require_tls: true

# ---------------------------------------------------------------------------
# Templates (optional custom templates)
# ---------------------------------------------------------------------------
templates:
  - "/etc/alertmanager/templates/*.tmpl"

# ---------------------------------------------------------------------------
# Route tree — group by severity
# ---------------------------------------------------------------------------
route:
  receiver: "email-default"
  group_by: ["alertname", "job", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

  routes:
    # Critical alerts — immediate notification, repeat every 4h
    - receiver: "email-critical"
      match:
        severity: critical
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h
      continue: false

    # Warning alerts — batched, repeat every 12h
    - receiver: "email-warning"
      match:
        severity: warning
      group_wait: 1m
      group_interval: 5m
      repeat_interval: 12h
      continue: false

# ---------------------------------------------------------------------------
# Inhibition rules — critical silences warning for the same alert
# ---------------------------------------------------------------------------
inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "job", "instance"]

# ---------------------------------------------------------------------------
# Receivers
# ---------------------------------------------------------------------------
receivers:
  - name: "email-default"
    email_configs:
      - to: "ops-team@au-ibar.org"
        send_resolved: true
        headers:
          Subject: "[ARIS Academy] {{ .GroupLabels.alertname }} — {{ .Status | toUpper }}"

  - name: "email-critical"
    email_configs:
      - to: "ops-critical@au-ibar.org"
        send_resolved: true
        headers:
          Subject: "[CRITICAL] ARIS Academy — {{ .GroupLabels.alertname }}"
        html: |
          <h2 style="color: #dc2626;">🚨 Critical Alert — ARIS Academy</h2>
          <p><strong>Alert:</strong> {{ .GroupLabels.alertname }}</p>
          <p><strong>Status:</strong> {{ .Status | toUpper }}</p>
          {{ range .Alerts }}
          <hr>
          <p><strong>Service:</strong> {{ .Labels.job }}</p>
          <p><strong>Instance:</strong> {{ .Labels.instance }}</p>
          <p><strong>Summary:</strong> {{ .Annotations.summary }}</p>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          <p><strong>Started:</strong> {{ .StartsAt.Format "2006-01-02 15:04:05 UTC" }}</p>
          {{ end }}
          <br>
          <p style="color: #6b7280; font-size: 12px;">ARIS Academy Monitoring — learning.au-ibar.org</p>

  - name: "email-warning"
    email_configs:
      - to: "ops-team@au-ibar.org"
        send_resolved: true
        headers:
          Subject: "[WARNING] ARIS Academy — {{ .GroupLabels.alertname }}"
