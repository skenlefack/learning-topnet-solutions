# ============================================================================
# Topnet Solutions Academy — Backup Cron Configuration
# Install: sudo cp infra/scripts/backup-cron.conf /etc/cron.d/academy-backup
#     or:  sudo crontab -l | cat - infra/scripts/backup-cron.conf | sudo crontab -
# ============================================================================

# Environment
SHELL=/bin/bash
PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
PROJECT_ROOT=/opt/topnet-academy

# ---------------------------------------------------------------------------
# Daily full backup at 2:00 AM
# ---------------------------------------------------------------------------
0 2 * * * root /opt/topnet-academy/infra/scripts/backup-postgres.sh >> /var/log/academy-backup.log 2>&1

# ---------------------------------------------------------------------------
# Weekly retention cleanup at 3:00 AM on Sunday
# Removes expired daily/weekly/monthly backups based on retention policy
# (backup-postgres.sh handles retention internally, but this ensures cleanup
#  even if a daily backup was missed)
# ---------------------------------------------------------------------------
0 3 * * 0 root /opt/topnet-academy/infra/scripts/backup-postgres.sh >> /var/log/academy-backup.log 2>&1

# ---------------------------------------------------------------------------
# Monthly schema-only backup at 1:00 AM on the 1st
# Lightweight schema archive for disaster recovery reference
# ---------------------------------------------------------------------------
0 1 1 * * root /opt/topnet-academy/infra/scripts/backup-postgres.sh --schema-only >> /var/log/academy-backup.log 2>&1

# ---------------------------------------------------------------------------
# Log rotation (keep backup logs from growing indefinitely)
# Rotate weekly, keep 4 weeks, compress old logs
# ---------------------------------------------------------------------------
# Create /etc/logrotate.d/academy-backup with:
#   /var/log/academy-backup.log {
#       weekly
#       rotate 4
#       compress
#       missingok
#       notifempty
#       create 0640 root root
#   }
